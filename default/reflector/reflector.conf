# Frost reflector defaults. reflector.timer refreshes the Arch mirrorlist
# (core/extra/multilib); CachyOS ranks its own repos with its own tool. No
# country filter, so this is correct anywhere: the newest-synced mirrors are
# taken worldwide, then sorted by measured download rate.
--save /etc/pacman.d/mirrorlist
--protocol https
--latest 20
--age 12
--sort rate
