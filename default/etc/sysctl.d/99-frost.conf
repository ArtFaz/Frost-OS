# Frost virtual-memory tuning. The 99- prefix is load-bearing: systemd orders
# sysctl.d entries by filename across /etc, /run and /usr/lib, and CachyOS ships
# /usr/lib/sysctl.d/70-cachyos-settings.conf with a conflicting vm.swappiness.
# zram is the primary swap; prefer compressed RAM to disk.
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0
