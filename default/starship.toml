# Frost prompt: directory, git when it matters, and the caret. Nothing else, so
# the line stays as short as a plain shell prompt.
add_newline = false
format = "$directory$git_branch$git_status$cmd_duration$character"

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[git_branch]
symbol = " "
style = "purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "red"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 2000
style = "yellow"
format = "took [$duration]($style) "
