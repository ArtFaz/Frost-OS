# Frost prompt. Package-owned; a user's own ~/.config/starship.toml still wins
# (bashrc only points STARSHIP_CONFIG here when the user has none). Original
# Frost work -- see THIRD_PARTY.md.
#
# Every glyph is a Nerd Font codepoint written as a \u escape so it survives any
# editor. The terminal renders these with Symbols Nerd Font Mono.

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
format = """
$directory\
$git_branch\
$git_status\
$rust$nodejs$python$golang\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold cyan)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold cyan)"

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true
read_only = " "
read_only_style = "red"

[git_branch]
symbol = " "
style = "dimmed purple"
format = "[on ](dimmed white)[$symbol$branch]($style) "

[git_status]
style = "dimmed yellow"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 2000
format = "[took $duration](dimmed yellow) "

[rust]
symbol = " "
style = "dimmed red"
format = "[$symbol($version )]($style)"

[nodejs]
symbol = " "
style = "dimmed green"
format = "[$symbol($version )]($style)"
detect_files = ["package.json", ".node-version", ".nvmrc"]

[python]
symbol = " "
style = "dimmed yellow"
format = "[$symbol($version )(\\($virtualenv\\) )]($style)"

[golang]
symbol = " "
style = "dimmed cyan"
format = "[$symbol($version )]($style)"
