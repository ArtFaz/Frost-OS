general {
    lock_cmd = systemctl --user start frost-lock.service
    before_sleep_cmd = systemctl --user start frost-lock.service
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 900
    on-timeout = systemctl --user start frost-lock.service
}

listener {
    timeout = 960
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
