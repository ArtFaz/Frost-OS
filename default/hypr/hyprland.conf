# Package-owned Frost session. User and administrator overlays enter only
# through the versioned Frost configuration contract in a later phase.

monitor = , preferred, auto, 1

$mainMod = SUPER

exec-once = systemctl --user start --no-block frost-session.target

input {
    kb_layout = br
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(9ed8ffff)
    col.inactive_border = rgba(334155aa)
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 12

    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(08111ccc)
    }
}

animations {
    enabled = true
    animation = global, 1, 4, default
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

bind = $mainMod, RETURN, exec, uwsm-app -- /usr/lib/frost/frost-terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, L, exec, systemctl --user start frost-lock.service
bind = $mainMod SHIFT, E, exec, uwsm stop
bind = $mainMod, F, fullscreen,
bind = $mainMod, V, togglefloating,

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
